<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Passwort setzen</title>
</head>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/darkmode.css">
<body>

	<div class="container d-flex flex-column align-items-center">

		<form id="setPasswordForm" class="d-flex flex-column mt-5">

			<input id="newPassword" class="form-control" name="newPassword" placeholder="neues Passwort">
			<input id="newPasswordConfirm" class="form-control" name="newPasswordConfirm" placeholder="neues Passwort bestätigen">

		</form>
	</div>

	<script src="/js/api.js"></script>
	<script src="/js/setPassword.js"></script>
	<script src="/js/auth.js"></script>
	
</body>
</html>
