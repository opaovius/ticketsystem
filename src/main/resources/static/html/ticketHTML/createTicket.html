<!DOCTYPE html>
<html>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/generell.css">
<head>
<meta charset="UTF-8">
<title>Neues Ticket</title>
</head>
<body>

	<div class="container">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2>Neues Ticket erstellen</h2>

		</div>
		
		<form id="createTicketForm">

		<div class="mb-3">
			<label for="header" class="form-label" >Titel</label>
			<input id="header" type="text" class="form-control" placeholder="Titel" required>
		</div>

		<div class="mb-3">
			<label for="text" class="form-label">Ihre Anfrage</label>
			<textarea id="text" class="form-control" rows="6" placeholder="Beschreiben Sie Ihr Anliegen" required></textarea>
		</div>
		
		
		<button type="button" class="btn btn-danger btn-hover btn-border-da" onclick="cancel()">Abbruch</button>
		
		<button type="submit" class="btn btn-primary btn-hover btn-border-pr mx-3" >Absenden</button>
		
		</form>

	</div>

	<script src="/js/api.js"></script>
	<script src="/js/ticketScripts/createTicket.js"></script>
</body>
</html>
