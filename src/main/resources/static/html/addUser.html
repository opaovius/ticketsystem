<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nutzer hinzufügen</title>
</head>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/darkmode.css">
<body>

	<div class="container">

		<a href="/html/manageUsers.html"
			class="btn btn-outline-primary btn-sm mb-3 mt-3">&larr; Zurück zur
			Übersicht</a>
			
		<div class="d-flex flex-column align-items-center">	
		
		<form id="addUserForm" class="d-flex flex-column mt-3">
		
			<input id="name" class="form-control" name="name" placeholder="Name">
			<input id="email" class="form-control" name="email" placeholder="Email">
			
			<select class="form-select" name="role">
			<option value="" selected>Rolle auswählen</option>
			<option value="CUSTOMER">Kunde</option>
			<option value="SUPPORT">Supporter</option>
			<option value="Admin">Admin</option>
			
			</select>

			<button type="submit" class="btn btn-primary">Nutzer erstellen</button>
		</form>

		</div>

	</div>
	
	<script src="/js/api.js"></script>
	<script src="/js/addUser.js"></script>

</body>
</html>
