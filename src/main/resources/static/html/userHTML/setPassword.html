<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Passwort setzen</title>
</head>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/generell.css">
<body>

	<div class="container d-flex flex-column align-items-center">

		<form id="setPasswordForm" class="d-flex flex-column mt-5">

			<input id="newPassword" class="form-control" name="newPassword"
				placeholder="neues Passwort" required minlength="6" maxlength="30">
			<input id="newPasswordConfirm" class="form-control"
				name="newPasswordConfirm" placeholder="neues Passwort bestätigen"
				required minlength="6" maxlength="30">

			<button type="submit" class="btn btn-primary">Bestätigen</button>
		</form>
	</div>

	<script src="/js/api.js"></script>
	<script src="/js/userScripts/setPassword.js"></script>
	<script src="/js/auth.js"></script>

</body>
</html>
