<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<title>Meine Tickets</title>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/ticketTable.css">
<link rel="stylesheet" href="/css/darkmode.css">
<body>

	<div class="container">
		<div class="d-flex justify-content-between align-items-center">
			<h2>Meine Tickets</h2>
			<button id="createTicketBtn" type="button" class="btn btn-primary"
				onclick="redirectCreateTicket()">+ Ticket erstellen</button>
			<button type="button" class="btn btn-danger" onclick="logout()">Abmelden</button>
		</div>

		<div class="table-wrapper">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
					<tr>
						<th>Header</th>
						<th>Text</th>
						<th>Status</th>
					</tr>
				</thead>
				<tbody id="ticketTableBody"></tbody>
			</table>
		</div>
	</div>

	<script src="/js/api.js"></script>
	<script src="/js/auth.js"></script>
	<script src="/js/tickets.js"></script>
	<script src="/js/createTicket.js"></script>
</body>
</html>
