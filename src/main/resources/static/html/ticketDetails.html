<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ihr Ticket</title>
</head>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/darkmode.css">
<body>

	<div class="container">
		<a href="/html/ticketsTable.html"
			class="btn btn-outline-primary btn-sm mb-3">&larr; Zurück zur
			Übersicht</a>

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 id="Header"></h2>
		</div>

		<div class="mb-3">
			<label class="form-label">Ihre Anfrage</label>
			<p id="Text" class="form-control"
				style="white-space: pre-wrap; min-height: 150px;"></p>
		</div>

		<hr class="my-4">

		<h4 class="mb-3">Antworten</h4>
		<div id="replyList"></div>

		<div class="mb-3">
			<label for="text" class="form-label">Hier antworten:</label>
			<textarea id="text" class="form-control" placeholder="..."></textarea>
			<button type="button" class="btn btn-primary" onclick="createReply()" >Absenden</button>
		</div>
		
		<div class="mb-3">
			<button id="closeBtn" type="button" class="btn btn-danger" onclick="closeTicket()"> close</button>
		</div>

	</div>


	<script src="/js/api.js"></script>
	<script src="/js/loadTicket.js"></script>
	<script src="/js/createReply.js"></script>
	<script src="/js/closeTicket.js"></script>
</body>
</html>
